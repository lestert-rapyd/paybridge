<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Checkout cancelled · Rapyd Demo</title>
  <link rel="stylesheet" href="../css/tokens.css" />
  <style>
    * { box-sizing: border-box; margin: 0; }
    body {
      min-height: 100vh; display: grid; place-items: center; padding: 24px;
      font-family: var(--font-ui); background: var(--app-bg); color: var(--ink);
      -webkit-font-smoothing: antialiased;
    }
    .card {
      width: 100%; max-width: 440px; padding: 44px 40px; text-align: center;
      background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-xl); box-shadow: var(--shadow-pop);
    }
    .brand { display: flex; align-items: baseline; justify-content: center; gap: 8px; margin-bottom: 28px; }
    .brand-word { font-size: 20px; font-weight: 700; letter-spacing: -.03em; }
    .brand-word::after { content: ''; display: inline-block; width: 6px; height: 6px; margin-left: 2px; border-radius: 50%; background: var(--accent); }
    .brand-sub { font-size: 14px; font-weight: 500; color: var(--muted); padding-left: 8px; border-left: 1px solid var(--line); }
    .badge {
      width: 64px; height: 64px; margin: 0 auto 18px; border-radius: 50%; display: grid; place-items: center;
      font-size: 28px; color: #fff; background: var(--faint);
    }
    h1 { font-size: 28px; font-weight: 600; letter-spacing: -.02em; }
    p { margin-top: 12px; font-size: 15px; line-height: 1.55; color: var(--muted); }
    a.btn {
      display: inline-flex; align-items: center; height: 48px; margin-top: 26px; padding: 0 26px;
      border-radius: var(--r-md); background: var(--accent); color: var(--on-accent);
      font-size: 15px; font-weight: 500; text-decoration: none;
    }
    a.btn:hover { filter: brightness(1.08); }
  </style>
</head>
<body>
  <main class="card">
    <div class="brand"><span class="brand-word">rapyd</span><span class="brand-sub">Demo</span></div>
    <div class="badge">✕</div>
    <h1>Checkout cancelled</h1>
    <p>No charge was made. You can close this tab and start a new payment from the demo whenever you're ready.</p>
    <a class="btn" href="../">Back to the demo</a>
  </main>
  <!-- Tell the demo tab the shopper is back (js/flows/toolkit.js listens on
       the same channel): its browser frame then shows the merchant's own
       cancel page. Same-origin only; it moves the frame, never marks a payment. -->
  <script>
    try { new BroadcastChannel('rapyd-demo-hosted').postMessage({ page: 'cancel' }); } catch (e) { /* unsupported — the demo follows the webhook */ }
  </script>
</body>
</html>
